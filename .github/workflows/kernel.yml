name: Build udon kernel

on:
  workflow_dispatch:
    inputs:
      kernel_revision:
        description: 'Git revision of rocko5498/android_kernel_oneplus_sm8450 to build'
        required: true
        default: '7669ea3eea6dcc83be271add1745bbc858a9809e'
      build_modules:
        description: 'Also compile the out-of-tree Qualcomm modules (artifacts only, best-effort)'
        required: true
        default: 'yes'
        type: choice
        options: ['yes', 'no']

permissions:
  contents: write

concurrency:
  group: udon-kernel
  cancel-in-progress: true

jobs:
  build:
    name: OnePlus 11R (udon) — GKI waipio kernel
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Runner specs
        run: |
          echo "vCPU: $(nproc)"
          free -h | sed -n '2p'
          df -h / | sed -n '2p'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex cpio libncurses5-dev libncurses-dev \
            libssl-dev lz4 zstd libelf-dev zip unzip python3

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Checkout kernel source (pinned to the ROM's exact commit)
        run: |
          git clone https://github.com/rocko5498/android_kernel_oneplus_sm8450 kernel
          cd kernel
          git checkout ${{ inputs.kernel_revision }}
          echo "kernel commit: $(git log --oneline -1)"

      - name: Checkout Qualcomm external modules
        run: |
          git clone https://github.com/pjgowtham/android_kernel_oneplus_sm8450-modules modules
          cd modules
          git checkout ca1104519fcb7e769129e75458a9da4833bcc751
          echo "modules commit: $(git log --oneline -1)"

      - name: Fetch AOSP clang-r536225 (Android 16 era toolchain)
        run: |
          wget -q --progress=dot:giga \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz" \
            -O /tmp/clang.tar.gz
          mkdir -p "$HOME/clang"
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/clang/bin:$PATH"
          clang --version | head -2

      - name: Configure kernel (gki_defconfig + waipio/oplus/debugfs fragments)
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/oplus_GKI.config \
            arch/arm64/configs/vendor/debugfs.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          echo "=== key config values ==="
          grep -E "^CONFIG_(MODULES|MODVERSIONS|LOCALVERSION|LTO|DEFAULT_INIT|MODULE_SIG)" out/.config || true

      - name: Build Image
        run: |
          cd kernel
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image
          ls -lh out/arch/arm64/boot/Image

      - name: Build external modules (best-effort)
        if: inputs.build_modules == 'yes'
        run: |
          cd kernel
          mkdir -p ../module-out
          mods=(
            "qcom/opensource/mmrm-driver"
            "qcom/opensource/audio-kernel"
            "qcom/opensource/camera-kernel"
            "qcom/opensource/dataipa/drivers/platform/msm"
            "qcom/opensource/datarmnet/core"
            "qcom/opensource/datarmnet-ext/aps"
            "qcom/opensource/datarmnet-ext/offload"
            "qcom/opensource/datarmnet-ext/shs"
            "qcom/opensource/datarmnet-ext/perf"
            "qcom/opensource/datarmnet-ext/perf_tether"
            "qcom/opensource/datarmnet-ext/sch"
            "qcom/opensource/datarmnet-ext/wlan"
            "qcom/opensource/display-drivers/msm"
            "qcom/opensource/eva-kernel"
            "qcom/opensource/video-driver"
            "qcom/opensource/wlan/qcacld-3.0/.qca6490"
          )
          ok=0; fail=0
          for m in "${mods[@]}"; do
            name=$(echo "$m" | tr '/' '_')
            if make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 M="$PWD/../modules/$m" modules > "../module-out/$name.log" 2>&1; then
              echo "OK   : $m"
              ok=$((ok+1))
            else
              echo "FAIL : $m  (see module-out/$name.log)"
              fail=$((fail+1))
            fi
          done
          echo "modules ok=$ok fail=$fail"
          find "$PWD/../modules" -name '*.ko' -newer "$PWD/Makefile" -exec cp {} ../module-out/ \; 2>/dev/null || true
          echo "total .ko collected: $(ls ../module-out/*.ko 2>/dev/null | wc -l)"

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel
          rm -rf anykernel/.git anykernel/.github anykernel/ramdisk/* 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image anykernel/Image
          cat > anykernel/anykernel.sh <<'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## udon (OnePlus 11R) kernel — RisingOS sixteen-qpr2 source

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=udon-kernel (RisingOS sixteen-qpr2 source)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=udon
          device.name2=CPH2487
          device.name3=OnePlus11R
          device.name4=OnePlus 11R
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          } # end attributes

          # boot shell variables
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install — swap the kernel Image only, keep everything else from the current boot.img
          split_boot;

          write_boot;
          ## end boot install
          AKEOF
          cd anykernel
          zip -r9 ../udon-kernel-AnyKernel3.zip .
          cd ..
          ls -lh udon-kernel-AnyKernel3.zip

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udon-kernel-build-${{ github.run_number }}
          path: |
            udon-kernel-AnyKernel3.zip
            kernel/out/.config
            module-out/*.ko
            module-out/*.log
          if-no-files-found: warn

      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: udon kernel build ${{ github.run_number }}
          body: |
            OnePlus 11R (udon) kernel built from the exact source used by RisingOS sixteen-qpr2:

            - kernel: rocko5498/android_kernel_oneplus_sm8450 @ ${{ inputs.kernel_revision }}
            - config: gki_defconfig + vendor/waipio_GKI.config + vendor/oplus_GKI.config + vendor/debugfs.config
            - toolchain: AOSP clang-r536225, LLVM=1 LLVM_IAS=1

            Flash `udon-kernel-AnyKernel3.zip` in recovery or via adb sideload.
          files: |
            udon-kernel-AnyKernel3.zip
            kernel/out/.config
          make_latest: true
