name: Build A17 prebuilt kernel package (lineage-24.0)

on:
  workflow_dispatch:
    inputs:
      kernel_revision:
        description: 'Git revision of rocko5498/android_kernel_oneplus_sm8450 (5.10 GKI kernel)'
        required: true
        default: '7669ea3eea6dcc83be271add1745bbc858a9809e'
      modules_revision:
        description: 'Git revision of Arman-ATI/android_kernel_oneplus_sm8450-modules (lineage-24.0 = QSSI16 modules)'
        required: true
        default: '34c1b3c57253b8e1e97d2a0385b98ea2a90a48ce'
      modules_repo:
        description: 'Modules repo (owner/name)'
        required: true
        default: 'Arman-ATI/android_kernel_oneplus_sm8450-modules'
      add_kernelsu:
        description: 'Integrate KernelSU into the Image'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
      kernelsu_tag:
        description: 'KernelSU tag (manager APK must match)'
        required: true
        default: 'v3.2.5'
      package_branch:
        description: 'Branch in this repo to publish the package to (device/oneplus/udon-kernel layout)'
        required: true
        default: 'lineage-24.0'
      dtbs_branch:
        description: 'Branch in this repo that holds dtbs/ (dtbo.img + base dtbs from stock firmware)'
        required: true
        default: 'a17-dtbs'

permissions:
  contents: write

concurrency:
  group: udon-kernel-a17
  cancel-in-progress: true

jobs:
  build:
    name: udon A17 prebuilt kernel package
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KSU_SUFFIX: ${{ inputs.add_kernelsu == 'yes' && '-ksu' || '' }}
    steps:
      - name: Runner specs
        run: |
          echo "vCPU: $(nproc)"
          free -h | sed -n '2p'
          df -h / | sed -n '2p'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex cpio libncurses5-dev libncurses-dev \
            libssl-dev lz4 zstd libelf-dev zip unzip python3 kmod rsync ccache

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Checkout this repo (full history, for dtbs branch + push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Fetch dtbs from ${{ inputs.dtbs_branch }} branch
        run: |
          git fetch origin ${{ inputs.dtbs_branch }}
          git checkout origin/${{ inputs.dtbs_branch }} -- dtbs/
          ls -la dtbs/
          [ -f dtbs/dtbo.img ] || { echo "FATAL: dtbs/dtbo.img missing on ${{ inputs.dtbs_branch }}"; exit 1; }
          ls dtbs/*.dtb >/dev/null 2>&1 || { echo "FATAL: no base .dtb files on ${{ inputs.dtbs_branch }}"; exit 1; }

      - name: Checkout kernel source (pinned)
        run: |
          git clone https://github.com/rocko5498/android_kernel_oneplus_sm8450 kernel
          cd kernel
          git checkout ${{ inputs.kernel_revision }}
          echo "kernel commit: $(git log --oneline -1)"

      - name: Integrate KernelSU (${{ inputs.kernelsu_tag }})
        if: inputs.add_kernelsu == 'yes'
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- ${{ inputs.kernelsu_tag }}
          git -C KernelSU log --oneline -1
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig

      - name: Checkout Qualcomm external modules (A17 / QSSI16)
        run: |
          git clone https://github.com/${{ inputs.modules_repo }} modules
          cd modules
          git checkout ${{ inputs.modules_revision }}
          echo "modules commit: $(git log --oneline -1)"

      - name: Fetch AOSP clang-r536225
        run: |
          wget -q --progress=dot:giga \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz" \
            -O /tmp/clang.tar.gz
          mkdir -p "$HOME/clang"
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/clang/bin:$PATH"
          clang --version | head -2

      - name: Configure kernel (gki_defconfig + waipio/oplus/debugfs fragments)
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          FRAGS="arch/arm64/configs/vendor/waipio_GKI.config \
                 arch/arm64/configs/vendor/oplus_GKI.config \
                 arch/arm64/configs/vendor/debugfs.config"
          if [ "${{ inputs.add_kernelsu }}" = "yes" ]; then
            printf 'CONFIG_KSU=y\n' > ksu.config
            FRAGS="$FRAGS ksu.config"
          fi
          ./scripts/kconfig/merge_config.sh -m -O out out/.config $FRAGS
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          echo "=== key config values ==="
          grep -E "^CONFIG_(MODULES|MODVERSIONS|LOCALVERSION|LTO|DEFAULT_INIT|MODULE_SIG|KPROBES|KALLSYMS|OVERLAY_FS|KSU)" out/.config || true
          if [ "${{ inputs.add_kernelsu }}" = "yes" ]; then
            grep -q "^CONFIG_KSU=y" out/.config || { echo "FATAL: CONFIG_KSU not enabled!"; exit 1; }
          fi
          cp out/.config kernel.config

      - name: Build Image
        run: |
          cd kernel
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image
          ls -lh out/arch/arm64/boot/Image
          grep -m1 . out/include/generated/utsrelease.h | tee /tmp/kver.txt

      - name: Build in-tree modules
        run: |
          cd kernel
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 modules
          echo "in-tree .ko: $(find out -name '*.ko' | wc -l)"

      - name: Build external modules (QSSI16 set)
        run: |
          cd kernel
          # Find every Kbuild under qcom/opensource (up to depth 4), skip parents
          # that also have a child Kbuild, and for qcacld use only the .qca6490 profile.
          mapfile -t all_kb < <(find "$PWD/../modules/qcom/opensource" -maxdepth 4 -name Kbuild | sort)
          declare -a build_paths=()
          for kb in "${all_kb[@]}"; do
            p="${kb%/Kbuild}"
            case "$p" in
              */qcacld-3.0) continue ;;                 # root qcacld Kbuild: skip
              */qcacld-3.0/*) case "$p" in */.qca6490) ;; *) continue ;; esac ;;
            esac
            has_child=0
            for other in "${all_kb[@]}"; do
              q="${other%/Kbuild}"
              if [ "$q" != "$p" ] && [[ "$q" == "$p"/* ]]; then has_child=1; break; fi
            done
            [ "$has_child" -eq 0 ] && build_paths+=("$p")
          done
          echo "=== module build paths (${#build_paths[@]}) ==="
          printf '  %s\n' "${build_paths[@]#"${PWD}/../modules/"}"
          ok=0; fail=0
          for m in "${build_paths[@]}"; do
            name=$(echo "$m" | tr '/' '_')
            if make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 M="$m" modules > "/tmp/$name.log" 2>&1; then
              echo "OK   : ${m#$PWD/../modules/}"
              ok=$((ok+1))
            else
              echo "FAIL : ${m#$PWD/../modules/}  (see /tmp/$name.log)"
              fail=$((fail+1))
            fi
          done
          echo "modules ok=$ok fail=$fail"
          [ "$fail" -eq 0 ] || { echo "FATAL: $fail module dirs failed to build"; exit 1; }

      - name: Fetch udon module lists from the A17 device tree
        run: |
          BASE="https://raw.githubusercontent.com/Gokulgethu/android_device_oneplus_sm8450-common/lineage-24.0-udon"
          for f in modules.load modules.load.vendor_boot modules.load.recovery; do
            curl -sf -o "$f" "$BASE/$f" || { echo "FATAL: cannot fetch $f"; exit 1; }
            echo "$f: $(wc -l < $f) entries"
          done

      - name: Assemble prebuilt kernel package
        run: |
          set -e
          KVER=$(grep -oE '5\.10\.[0-9]+[^"]*' /tmp/kver.txt | head -1)
          echo "kernel release: $KVER"
          # gather every built .ko in one place
          mkdir -p allko
          find kernel/out -name '*.ko' -exec cp {} allko/ \;
          find modules -name '*.ko' -exec cp {} allko/ \;
          echo "total distinct .ko: $(ls allko | wc -l)"

          # ---- vendor_dlkm: exactly the modules.load set ----
          mkdir -p pkg/vendor_dlkm pkg/vendor_ramdisk
          missing=0
          while read -r m; do
            [ -z "$m" ] && continue
            if [ -f "allko/$m" ]; then cp "allko/$m" pkg/vendor_dlkm/; else
              echo "MISSING(vendor_dlkm): $m"; missing=$((missing+1)); fi
          done < modules.load
          # ---- vendor_ramdisk: union of vendor_boot + recovery lists ----
          cat modules.load.recovery modules.load.vendor_boot | sort -u > ramdisk.set
          while read -r m; do
            [ -z "$m" ] && continue
            if [ -f "allko/$m" ]; then cp "allko/$m" pkg/vendor_ramdisk/; else
              echo "MISSING(vendor_ramdisk): $m"; missing=$((missing+1)); fi
          done < ramdisk.set
          echo "vendor_dlkm .ko: $(ls pkg/vendor_dlkm/*.ko | wc -l) / $(wc -l < modules.load)"
          echo "vendor_ramdisk .ko: $(ls pkg/vendor_ramdisk/*.ko | wc -l) / $(wc -l < ramdisk.set)"
          if [ "$missing" -ne 0 ]; then
            echo "FATAL: $missing listed modules were not built - see MISSING lines above"
            echo "(if they are =y builtins in kernel.config, they must be flipped to =m)"
            exit 1
          fi

          # ---- list files inside the package (BoardConfig reads them from here) ----
          cp modules.load pkg/vendor_dlkm/modules.load
          cp modules.load.recovery pkg/vendor_ramdisk/modules.load.recovery
          cp modules.load.vendor_boot pkg/vendor_ramdisk/modules.load
          # blocklist from the kernel source (qcom vendor blocklist for waipio)
          cp kernel/modules.vendor_blocklist.msm.waipio pkg/vendor_dlkm/modules.blocklist
          cp kernel/modules.vendor_blocklist.msm.waipio pkg/vendor_ramdisk/modules.blocklist

          # ---- depmod metadata (modules.dep / .alias / .softdep) ----
          for sub in vendor_dlkm vendor_ramdisk; do
            mkdir -p "depmod/lib/modules/$KVER"
            cp "pkg/$sub"/*.ko "depmod/lib/modules/$KVER/"
            depmod -b depmod "$KVER" || true
            cp "depmod/lib/modules/$KVER/modules.dep" "pkg/$sub/modules.dep"
            cp "depmod/lib/modules/$KVER/modules.alias" "pkg/$sub/modules.alias"
            cp "depmod/lib/modules/$KVER/modules.softdep" "pkg/$sub/modules.softdep"
            rm -rf depmod
          done

          # ---- kernel-headers: merged techpack uapi + trivial headers_install Makefile ----
          mkdir -p pkg/kernel-headers
          for d in modules/qcom/opensource/*/include/uapi; do
            [ -d "$d" ] && cp -r "$d"/. pkg/kernel-headers/
          done
          cat > pkg/kernel-headers/Makefile <<'EOF'
          VERSION = 5
          PATCHLEVEL = 10

          headers_install:
          	@mkdir -p $(O)/usr/include
          	@rsync -mrq $(shell pwd)/* $(O)/usr/include

          all:
          	@true
          EOF

          # ---- Image + dtbs ----
          cp kernel/out/arch/arm64/boot/Image pkg/Image
          cp -r dtbs pkg/dtbs
          ls -la pkg/
          du -sh pkg/*

      - name: Verify package against device-tree expectations
        run: |
          # every name in the package lists must have a .ko present in the same dir
          err=0
          while read -r m; do
            [ -z "$m" ] && continue
            [ -f "pkg/vendor_dlkm/$m" ] || { echo "vendor_dlkm/$m missing"; err=1; }
          done < pkg/vendor_dlkm/modules.load
          while read -r m; do
            [ -z "$m" ] && continue
            [ -f "pkg/vendor_ramdisk/$m" ] || { echo "vendor_ramdisk/$m missing"; err=1; }
          done < pkg/vendor_ramdisk/modules.load
          while read -r m; do
            [ -z "$m" ] && continue
            [ -f "pkg/vendor_ramdisk/$m" ] || { echo "vendor_ramdisk(recovery)/$m missing"; err=1; }
          done < pkg/vendor_ramdisk/modules.load.recovery
          [ -f pkg/Image ] && echo "Image OK: $(du -h pkg/Image | cut -f1)"
          [ -f pkg/dtbs/dtbo.img ] && echo "dtbo.img OK: $(du -h pkg/dtbs/dtbo.img | cut -f1)"
          [ -f pkg/kernel-headers/Makefile ] && echo "kernel-headers OK: $(find pkg/kernel-headers -type f | wc -l) files"
          [ "$err" -eq 0 ] || { echo "FATAL: package verification failed"; exit 1; }
          echo "PACKAGE VERIFIED"

      - name: Publish package to ${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}
        run: |
          git config user.name "udon-kernel-bot"
          git config user.email "udon-kernel-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}" >/dev/null 2>&1; then
            git fetch origin "${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}"
            git checkout -B "${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}" "origin/${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}"
            git rm -rq --ignore-unmatch vendor_dlkm vendor_ramdisk kernel-headers dtbs Image || true
          else
            git checkout -B "${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}" origin/main
          fi
          cp -r pkg/vendor_dlkm pkg/vendor_ramdisk pkg/kernel-headers pkg/dtbs ./
          cp pkg/Image ./Image
          git add -A vendor_dlkm vendor_ramdisk kernel-headers dtbs Image
          git commit -qm "A17 prebuilt kernel package (lineage-24.0)

- kernel: rocko5498/android_kernel_oneplus_sm8450 @ ${{ inputs.kernel_revision }}
- modules: ${{ inputs.modules_repo }} @ ${{ inputs.modules_revision }} (QSSI16.0 WAIPIO)
- config: gki_defconfig + vendor/waipio_GKI.config + vendor/oplus_GKI.config + vendor/debugfs.config
- toolchain: AOSP clang-r536225, LLVM=1 LLVM_IAS=1
- dtbs: from stock CPH2487_16.0.5.700(EX01) firmware (dtbo.img + base dtbs)
- layout: Image, dtbs/, kernel-headers/, vendor_dlkm/, vendor_ramdisk/
  (consumed via KERNEL_PATH := device/oneplus/udon-kernel)
${{ inputs.add_kernelsu == 'yes' && format('- KernelSU: tiann/KernelSU @ {0}', inputs.kernelsu_tag) || '- no KernelSU' }}"
          git push origin "${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}"

      - name: Package release zip
        run: |
          cd pkg && zip -r9 ../udon-kernel-a17${KSU_SUFFIX}-prebuilt.zip . && cd ..
          ls -lh udon-kernel-a17${KSU_SUFFIX}-prebuilt.zip

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udon-kernel-a17${{ env.KSU_SUFFIX }}-${{ github.run_number }}
          path: |
            udon-kernel-a17*-prebuilt.zip
            kernel.config
          if-no-files-found: warn

      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: a17${{ env.KSU_SUFFIX }}-${{ github.run_number }}
          name: udon A17 prebuilt kernel package ${{ github.run_number }}
          body: |
            Prebuilt kernel package (device/oneplus/udon-kernel layout) for the
            lineage-24.0 / Android 17 udon trees:

            - kernel: rocko5498/android_kernel_oneplus_sm8450 @ ${{ inputs.kernel_revision }}
            - modules: ${{ inputs.modules_repo }} @ ${{ inputs.modules_revision }} (QSSI16.0 WAIPIO)
            - dtbs: from stock CPH2487_16.0.5.700(EX01) firmware
            - published to branch: ${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}
            ${{ inputs.add_kernelsu == 'yes' && format('- KernelSU: tiann/KernelSU @ {0}', inputs.kernelsu_tag) || '- no KernelSU' }}

            Pin in the ROM manifest:
            `<project path="device/oneplus/udon-kernel" name="udon-kernel" remote="gokul" revision="${{ inputs.package_branch }}${{ env.KSU_SUFFIX }}" />`
          files: |
            udon-kernel-a17*-prebuilt.zip
            kernel.config
          make_latest: true
